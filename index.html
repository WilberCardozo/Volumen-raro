<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1916" media="(prefers-color-scheme: dark)">
  <title>Volumen Raro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1>Volumen Raro</h1>
    <p>Dos controles de volumen poco convencionales para un video que elijas.</p>
  </header>

  <main class="layout">
    <section class="card video-card">
      <div class="video-wrap" id="videoWrap">
        <video id="video" playsinline preload="metadata" hidden></video>
        <input type="file" id="fileInput" class="visually-hidden" accept="video/*,audio/*" tabindex="-1">
        <label class="picker" id="picker" for="fileInput" tabindex="0">
          <span class="picker-icon" aria-hidden="true">🎬</span>
          <span class="picker-title">Elige un video</span>
          <span class="picker-sub">Toca aquí o arrastra un archivo. No se sube a ningún sitio.</span>
        </label>
      </div>
      <div class="player-controls" id="controls" hidden>
        <button type="button" id="playBtn" aria-label="Reproducir">▶</button>
        <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Posición">
        <span class="time" id="time">0:00 / 0:00</span>
        <button type="button" id="changeBtn" class="secondary">Cambiar</button>
      </div>
      <p class="status" id="status">Elige un video para empezar.</p>
    </section>

    <section class="card">
      <h2>ahi te ves</h2>
      <p class="hint">Estilo angry birds.</p>
      <div class="canvas-wrap" id="slingWrap">
        <canvas id="sling" aria-label="Tirachinas de volumen"></canvas>
      </div>
      <p class="readout">Volumen: <strong id="slingValue">—</strong></p>
    </section>

    <section class="card">
      <h2>Volumen romano</h2>
      <form id="romanForm" class="roman-form" autocomplete="off">
        <input id="romanInput" type="text" inputmode="text" spellcheck="false"
               autocapitalize="characters" autocorrect="off" autocomplete="off"
               enterkeyhint="done" maxlength="12" aria-label="Volumen">
      </form>
      <p class="error" id="romanError" role="alert"></p>
      <div class="roman-display" aria-live="polite">
        <span class="roman-label">Volumen actual</span>
        <span class="roman-value" id="romanValue">—</span>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
